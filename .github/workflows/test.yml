name: Tests

# Unit tests (plain Python, no Databricks needed): the silver checks and the gold chunker.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pypdf langchain-text-splitters==1.1.3
      - run: pytest -q
