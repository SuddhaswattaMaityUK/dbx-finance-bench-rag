resources:
  jobs:
    validate_silver:
      name: validate_silver
      # A separate pipeline: it only reads the tables, checks them, and fails if a rule that must hold is broken.
      # Run it after the ingest job (databricks bundle run validate_silver -t <target>) or on a schedule.
      tasks:
        - task_key: validate_silver
          notebook_task:
            notebook_path: ../src/validate/validate_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
