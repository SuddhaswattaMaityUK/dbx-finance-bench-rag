resources:
  jobs:
    financebench_pipeline:
      name: financebench_pipeline
      # The whole flow as one unit: one run, one schedule, one place to see failures.
      # Each step is its own job, so it can still be run and tested alone.
      # test_retrieval is not part of it: it is run by hand, because its Vector Search endpoint is billed by the hour.
      tasks:
        - task_key: ingestion
          run_job_task:
            job_id: ${resources.jobs.ingest_financebench.id}

        - task_key: validation
          depends_on:
            - task_key: ingestion
          run_job_task:
            job_id: ${resources.jobs.validate_silver.id}

        - task_key: indexing
          depends_on:
            - task_key: validation
          run_job_task:
            job_id: ${resources.jobs.indexing.id}
