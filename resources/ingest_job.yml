resources:
  jobs:
    ingest_financebench:
      name: ingest_financebench
      # No cluster: serverless compute (the only option on Databricks Free Edition).
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pymupdf  # silver step 2b: builds a small PDF from the pages to re-parse
      tasks:
        - task_key: download
          environment_key: default
          spark_python_task:
            python_file: ../src/download.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

        - task_key: bronze_pdfs
          depends_on:
            - task_key: download
          notebook_task:
            notebook_path: ../src/bronze_pdfs.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_parser
          depends_on:
            - task_key: bronze_pdfs
          notebook_task:
            notebook_path: ../src/silver_pdfs.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
