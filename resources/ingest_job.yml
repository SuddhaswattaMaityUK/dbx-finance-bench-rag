resources:
  jobs:
    ingest_financebench:
      name: ingest_financebench
      # No cluster: serverless compute (the only option on Databricks Free Edition).
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: download
          environment_key: default
          spark_python_task:
            python_file: ../src/bronze/download.py
            parameters:
              - --match
              - ${var.pdf_match}
              - --limit
              - ${var.pdf_limit}

        - task_key: bronze_pdfs
          depends_on:
            - task_key: download
          notebook_task:
            notebook_path: ../src/bronze/bronze_pdfs.ipynb

        # Bronze, second step: cut the long PDFs into parts of at most PART_PAGES pages.
        - task_key: bronze_split
          depends_on:
            - task_key: bronze_pdfs
          notebook_task:
            notebook_path: ../src/bronze/split_pdfs.ipynb

        # Silver: the AI parser on the parts it has not seen (a stream with a checkpoint). Its constants are in the notebook.
        - task_key: silver_parse
          depends_on:
            - task_key: bronze_split
          notebook_task:
            notebook_path: ../src/silver/parse_pdfs.ipynb

        # Gold: parent-child chunks, a stream on silver_parsed. Documents with new parts are chunked again and replaced.
        - task_key: gold_chunk
          depends_on:
            - task_key: silver_parse
          notebook_task:
            notebook_path: ../src/gold/chunk.ipynb

        # Gold, second step: a vector for every child that has none, or whose text changed. Kept in gold_embeddings.
        - task_key: gold_embed
          depends_on:
            - task_key: gold_chunk
          notebook_task:
            notebook_path: ../src/gold/embed.ipynb
