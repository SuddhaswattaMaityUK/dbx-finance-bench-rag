resources:
  jobs:
    ingest_financebench:
      name: ingest_financebench
      # No cluster: serverless compute (the only option on Databricks Free Edition).
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: download
          environment_key: default
          spark_python_task:
            python_file: ../src/ingest/download.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --match
              - ${var.pdf_match}
              - --limit
              - ${var.pdf_limit}

        - task_key: bronze_pdfs
          depends_on:
            - task_key: download
          notebook_task:
            notebook_path: ../src/ingest/bronze_pdfs.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}

        # Bronze, second step: cut the long PDFs into parts of at most part_pages pages.
        - task_key: bronze_split
          depends_on:
            - task_key: bronze_pdfs
          notebook_task:
            notebook_path: ../src/ingest/split_pdfs.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              part_pages: ${var.part_pages}

        # Silver: parse and check the parts, retry the failed parses, convert the pages. Each task can run on its own.
        - task_key: silver_parse
          depends_on:
            - task_key: bronze_split
          notebook_task:
            notebook_path: ../src/silver/parse_pdfs.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}

        - task_key: silver_retry
          depends_on:
            - task_key: silver_parse
          notebook_task:
            notebook_path: ../src/silver/retry_parses.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}

        - task_key: silver_convert
          depends_on:
            - task_key: silver_retry
          notebook_task:
            notebook_path: ../src/silver/convert_pages.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
