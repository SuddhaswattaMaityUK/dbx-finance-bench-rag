resources:
  jobs:
    ingest_financebench:
      name: ingest_financebench
      # No cluster: serverless compute (the only option on Databricks Free Edition).
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: ingest_raw
          environment_key: default
          spark_python_task:
            python_file: ../src/ingest_raw.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
