# Databricks Asset Bundle for dbx-finance-bench-rag
bundle:
  name: dbx_finance_bench_rag

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: workspace
  bronze_schema:
    description: Schema of the bronze layer (the volume, bronze_pdfs, bronze_pdf_parts). Each target has its own, so testing in dev never touches prod data
    default: finance_bench_bronze
  silver_schema:
    description: Schema of the silver layer (parsed parts, pages, log, documents)
    default: finance_bench_silver
  gold_schema:
    description: Schema of the gold layer (chunks, embeddings, retrieval test results)
    default: finance_bench_gold
  embedding_endpoint:
    description: Model endpoint that embeds the chunks and the questions (the same one for both)
    default: databricks-gte-large-en
  vector_search_endpoint:
    description: Vector Search endpoint that test_retrieval creates and deletes again
    default: financebench_vs
  pdf_match:
    description: Download only the PDFs whose file name matches this regex
    default: ".*"
  pdf_limit:
    description: Download only the first n PDFs (0 = all)
    default: "0"
  part_pages:
    description: PDFs with more pages are cut into parts of this size before they are parsed
    default: "50"

targets:
  # dev: its own schemas, a small sample of short PDFs. Safe to break.
  dev:
    mode: development
    default: true
    variables:
      bronze_schema: finance_bench_bronze_dev
      silver_schema: finance_bench_silver_dev
      gold_schema: finance_bench_gold_dev
      vector_search_endpoint: financebench_vs_dev
      pdf_match: EARNINGS
      pdf_limit: "28"
      part_pages: "5"  # the dev PDFs are short: a small part size makes the split run
    workspace:
      host: https://dbc-9551b733-1e19.cloud.databricks.com

  # prod: all the PDFs, in the real schemas.
  prod:
    mode: production
    workspace:
      host: https://dbc-9551b733-1e19.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
